    <script>


        function f1(){

            const start = Date.now()

            const arr = []

            for(let i=0;i<10000000;i++){
                arr.push(i)
            }
            console.log("f1",Date.now() - start);
            
        }

        function f2(){

            const start = Date.now()

            const arr = new Array(10000000).fill(0)

            for(let i=0;i<10000000;i++){
                arr[i] = i
            }
            console.log("f2",Date.now() - start);
            
        }

        f1()
        f2()
    </script>
